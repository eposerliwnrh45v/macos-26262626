name: Private macOS Test Desktop
on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Start noVNC desktop
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.MAC_VNC_PASSWORD }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          if [[ ! "${VNC_PASSWORD:-}" =~ ^[[:print:]]{8,}$ ]]; then
            echo "::error::Set MAC_VNC_PASSWORD to at least 8 printable ASCII characters."
            exit 1
          fi
          if (( ${#VNC_PASSWORD} > 8 )); then
            echo "::notice::Legacy VNC uses only the first 8 characters of MAC_VNC_PASSWORD."
            VNC_PASSWORD="${VNC_PASSWORD:0:8}"
          fi

          novnc_dir="${RUNNER_TEMP}/noVNC"
          venv_dir="${RUNNER_TEMP}/websockify-venv"
          websockify_log="${RUNNER_TEMP}/websockify.log"
          cloudflared_log="${RUNNER_TEMP}/cloudflared.log"
          websockify_pid="${RUNNER_TEMP}/websockify.pid"
          cloudflared_pid="${RUNNER_TEMP}/cloudflared.pid"

          git clone --depth 1 https://github.com/novnc/noVNC.git "$novnc_dir"
          python3 -m venv "$venv_dir"
          "$venv_dir/bin/python" -m pip install --disable-pip-version-check websockify
          brew install cloudflared

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "$VNC_PASSWORD" \
            -restart -agent -privs -all

          for attempt in {1..30}; do
            if nc -z 127.0.0.1 5900; then
              break
            fi
            sleep 1
          done
          if ! nc -z 127.0.0.1 5900; then
            echo "::error::The macOS runner did not start its VNC service."
            exit 1
          fi

          "$venv_dir/bin/websockify" --web="$novnc_dir" \
            127.0.0.1:6080 127.0.0.1:5900 >"$websockify_log" 2>&1 &
          echo "$!" > "$websockify_pid"

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:6080/vnc.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if (( ready == 0 )); then
            cat "$websockify_log"
            echo "::error::noVNC did not start."
            exit 1
          fi

          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6080 \
            >"$cloudflared_log" 2>&1 &
          echo "$!" > "$cloudflared_pid"

          tunnel_url=""
          for attempt in {1..30}; do
            tunnel_url="$(grep -Eo 'https://[[:alnum:]-]+\.trycloudflare\.com' "$cloudflared_log" | head -n 1 || true)"
            if [[ -n "$tunnel_url" ]]; then
              break
            fi
            sleep 1
          done
          if [[ -z "$tunnel_url" ]]; then
            cat "$cloudflared_log"
            echo "::error::Cloudflare did not provide a temporary tunnel URL."
            exit 1
          fi

          echo "::notice title=noVNC URL::$tunnel_url/vnc.html"
          echo "noVNC URL: $tunnel_url/vnc.html"

          while sleep 60; do
            :
          done

      - name: Stop private desktop
        if: always()
        shell: bash
        run: |
          for pid_file in "${RUNNER_TEMP}/websockify.pid" "${RUNNER_TEMP}/cloudflared.pid"; do
            if [[ -f "$pid_file" ]]; then
              read -r pid < "$pid_file"
              if kill -0 "$pid" 2>/dev/null; then
                kill "$pid" || echo "::warning::Could not stop process $pid."
              fi
            fi
          done
