name: Private macOS Test Desktop
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Start private macOS desktop
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.MAC_VNC_PASSWORD }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          if [[ ! "${VNC_PASSWORD:-}" =~ ^[[:graph:]]{8}$ ]]; then
            echo "::error::Set MAC_VNC_PASSWORD to exactly 8 printable ASCII characters."
            exit 1
          fi

          guac_home="${RUNNER_TEMP}/guacamole"
          mkdir -p "$guac_home"
          chmod 700 "$guac_home"

          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.Element("user-mapping")
          user = ET.SubElement(
              root,
              "authorize",
              username="runner",
              password=os.environ["VNC_PASSWORD"],
          )
          connection = ET.SubElement(user, "connection", name="macOS desktop")
          ET.SubElement(connection, "protocol").text = "vnc"
          for name, value in {
              "hostname": "host.docker.internal",
              "port": "5900",
              "password": os.environ["VNC_PASSWORD"],
          }.items():
              ET.SubElement(connection, "param", name=name).text = value

          path = os.path.join(os.environ["RUNNER_TEMP"], "guacamole", "user-mapping.xml")
          ET.ElementTree(root).write(path, encoding="utf-8", xml_declaration=True)
          os.chmod(path, 0o600)
          PY

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "$VNC_PASSWORD" \
            -restart -agent -privs -all

          for attempt in {1..30}; do
            if nc -z 127.0.0.1 5900; then
              break
            fi
            sleep 1
          done
          if ! nc -z 127.0.0.1 5900; then
            echo "::error::The macOS runner did not start its VNC service."
            exit 1
          fi

          brew install colima docker
          colima start --cpu 2 --memory 4 --disk 20
          docker info >/dev/null
          docker network create guacamole

          docker run --detach --name guacd --network guacamole \
            guacamole/guacd:1.6.0
          docker run --detach --name guacamole --network guacamole \
            --publish 127.0.0.1:8080:8080 \
            --volume "$guac_home:/etc/guacamole:ro" \
            --env GUACD_HOSTNAME=guacd \
            guacamole/guacamole:1.6.0

          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/guacamole/ >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if (( ready == 0 )); then
            docker logs guacamole
            docker logs guacd
            echo "::error::Apache Guacamole did not become ready."
            exit 1
          fi

          tailscale serve --bg --tcp=8080 tcp://localhost:8080
          echo "Connect over Tailscale to http://$(tailscale ip -4):8080/guacamole/"
          tailscale serve status
          echo "Log in as runner with the password stored in MAC_VNC_PASSWORD."

          while sleep 60; do
            :
          done

      - name: Stop private desktop
        if: always()
        shell: bash
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            docker rm --force guacamole guacd >/dev/null 2>&1 || echo "::warning::Could not remove Guacamole containers."
            docker network rm guacamole >/dev/null 2>&1 || echo "::warning::Could not remove the Guacamole network."
          fi

          if command -v colima >/dev/null 2>&1; then
            colima stop || echo "::warning::Could not stop Colima."
          fi

          if command -v tailscale >/dev/null 2>&1; then
            tailscale serve reset || echo "::warning::Could not reset Tailscale Serve."
          fi
